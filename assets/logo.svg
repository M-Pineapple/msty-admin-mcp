<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Msty Admin MCP — local AI service administration">
  <title>Msty Admin MCP</title>

  <defs>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="rowfill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e2a3f"/>
      <stop offset="100%" stop-color="#162132"/>
    </linearGradient>

    <radialGradient id="ledon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow -->
  <rect x="22" y="44" width="356" height="316" rx="22" fill="#000" opacity="0.18"/>

  <!-- Terminal window -->
  <rect x="20" y="40" width="360" height="320" rx="22"
        fill="url(#window)" stroke="#334155" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M 20,62 Q 20,40 42,40 L 358,40 Q 380,40 380,62 L 380,82 L 20,82 Z"
        fill="url(#titlebar)" opacity="0.7"/>
  <line x1="20" y1="82" x2="380" y2="82" stroke="#0b1220" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="42" cy="61" r="6" fill="#ef4444"/>
  <circle cx="62" cy="61" r="6" fill="#eab308"/>
  <circle cx="82" cy="61" r="6" fill="#22c55e"/>

  <!-- Title text -->
  <text x="200" y="66" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
        font-size="11" font-weight="600" fill="#64748b">msty-admin</text>

  <!-- Service rows: 4 stacked modules, each is one MSTY backend -->
  <!-- Row dimensions: width 280 (centered), height 36, gap 8 -->
  <!-- Total stack: 4*36 + 3*8 = 168, centered vertically in body (82..360 = 278), so y_start = 82 + (278-168)/2 = 137 -->

  <g transform="translate(60, 110)">

    <!-- Row 1: ollama -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="36" rx="6" fill="url(#rowfill)" stroke="#334155" stroke-width="0.5"/>
      <circle cx="20" cy="18" r="6" fill="url(#ledon)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0s"/>
      </circle>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="11" font-weight="600" fill="#cbd5e1">ollama</text>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="9" fill="#64748b" dx="100">:11964</text>
      <!-- mini activity bars -->
      <rect x="234" y="22" width="6" height="10" fill="url(#bar)" rx="1"/>
      <rect x="244" y="14" width="6" height="18" fill="url(#bar)" rx="1"/>
      <rect x="254" y="20" width="6" height="12" fill="url(#bar)" rx="1"/>
      <rect x="264" y="11" width="6" height="21" fill="url(#bar)" rx="1"/>
    </g>

    <!-- Row 2: mlx -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="280" height="36" rx="6" fill="url(#rowfill)" stroke="#334155" stroke-width="0.5"/>
      <circle cx="20" cy="18" r="6" fill="url(#ledon)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="11" font-weight="600" fill="#cbd5e1">mlx</text>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="9" fill="#64748b" dx="100">:11973</text>
      <rect x="234" y="22" width="6" height="10" fill="url(#bar)" rx="1"/>
      <rect x="244" y="17" width="6" height="15" fill="url(#bar)" rx="1"/>
      <rect x="254" y="13" width="6" height="19" fill="url(#bar)" rx="1"/>
      <rect x="264" y="20" width="6" height="12" fill="url(#bar)" rx="1"/>
    </g>

    <!-- Row 3: llama.cpp -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="280" height="36" rx="6" fill="url(#rowfill)" stroke="#334155" stroke-width="0.5"/>
      <circle cx="20" cy="18" r="6" fill="url(#ledon)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="11" font-weight="600" fill="#cbd5e1">llama.cpp</text>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="9" fill="#64748b" dx="100">:11454</text>
      <rect x="234" y="22" width="6" height="10" fill="url(#bar)" rx="1"/>
      <rect x="244" y="20" width="6" height="12" fill="url(#bar)" rx="1"/>
      <rect x="254" y="17" width="6" height="15" fill="url(#bar)" rx="1"/>
      <rect x="264" y="14" width="6" height="18" fill="url(#bar)" rx="1"/>
    </g>

    <!-- Row 4: vibe -->
    <g transform="translate(0, 132)">
      <rect x="0" y="0" width="280" height="36" rx="6" fill="url(#rowfill)" stroke="#334155" stroke-width="0.5"/>
      <circle cx="20" cy="18" r="6" fill="url(#ledon)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="11" font-weight="600" fill="#cbd5e1">vibe</text>
      <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="9" fill="#64748b" dx="100">:8317</text>
      <rect x="234" y="22" width="6" height="14" fill="url(#bar)" rx="1"/>
      <rect x="244" y="11" width="6" height="21" fill="url(#bar)" rx="1"/>
      <rect x="254" y="20" width="6" height="12" fill="url(#bar)" rx="1"/>
      <rect x="264" y="16" width="6" height="16" fill="url(#bar)" rx="1"/>
    </g>

  </g>

  <!-- Bottom prompt with pulsing cursor -->
  <g transform="translate(40, 332)">
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
          font-size="14" font-weight="600" fill="#22d3ee">&#x276F;</text>
    <text x="20" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace"
          font-size="13" font-weight="500" fill="#fef3c7">msty-admin</text>
    <rect x="125" y="-12" width="9" height="14" fill="#fef3c7">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
